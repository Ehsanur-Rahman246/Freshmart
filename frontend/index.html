    <title>Freshmart</title>
    <style>
    html, body {
      background-color: hsl(40 30% 93%);
    }
  </style>

  <body>
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;justify-content:center;align-items:center;">

      </div>
    </div>

    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <script>
      lottie.loadAnimation({
        container: document.getElementById("lottie-loader"),
        path: "/loading-screen.json",
        renderer: "svg",
        loop: true,
        autoplay: true,
      });
    </script>
